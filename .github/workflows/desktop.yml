# Builds ottod for Windows and Linux, drives it through the desktop bridge (ConPTY / Unix PTY end
# to end), screenshots the real app on each platform and packages the installers.
name: Desktop

on:
  push:
    branches: [main, "cross-platform/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-2022
    # Native SwiftPM: Swift Build (6.4's default on Windows) ignores platform conditions on
    # target dependencies and builds SwiftNIO, which does not compile there.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          # Matches the Mac toolchain (Xcode 27, Swift 6.4); 6.2 rejects swift-websocket's Span use.
          branch: swift-6.4.2-release
          tag: 6.4.2-RELEASE

      - name: Build ottod
        shell: pwsh
        run: |
          swift build --build-system native -c release --product ottod 2>&1 | Tee-Object -FilePath ottod-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = swift build --build-system native -c release --show-bin-path
          New-Item -ItemType Directory -Force Apps/OttoDesktop/bin/win32-x64 | Out-Null
          Copy-Item "$bin/ottod.exe" Apps/OttoDesktop/bin/win32-x64/
          Get-ChildItem "$bin" -Filter *.dll | Copy-Item -Destination Apps/OttoDesktop/bin/win32-x64/
          # Ship the Swift runtime beside ottod.exe; the loader searches the executable's folder first.
          $runtime = Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Runtimes" -Recurse -Filter swiftCore.dll |
            Select-Object -First 1
          if (-not $runtime) { throw "Swift runtime not found" }
          Get-ChildItem $runtime.DirectoryName -Filter *.dll | Copy-Item -Destination Apps/OttoDesktop/bin/win32-x64/
          Get-ChildItem Apps/OttoDesktop/bin/win32-x64 | Format-Table Name, Length

      - name: Build otto-engine (experimental on Windows)
        id: engine
        continue-on-error: true
        shell: pwsh
        run: |
          swift build --build-system native -c release --product otto-engine 2>&1 | Tee-Object -FilePath engine-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build --build-system native -c release --product otto-mcp 2>&1 | Tee-Object -Append -FilePath engine-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = swift build --build-system native -c release --show-bin-path
          # otto-mcp sits beside otto-engine: it is how agents reach Otto's tools.
          Copy-Item "$bin/otto-engine.exe", "$bin/otto-mcp.exe" Apps/OttoDesktop/bin/win32-x64/
          Get-ChildItem "$bin" -Filter *.dll | Copy-Item -Destination Apps/OttoDesktop/bin/win32-x64/ -Force

      - name: Build engine modules one by one (diagnostics)
        if: steps.engine.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: |
          # One failing module hides the rest; build each so a single run reports every error.
          $targets = "OttoServices"
          foreach ($target in $targets) {
            "=== $target ===" | Out-File -Append modules-build.log
            swift build --build-system native -c release --target $target 2>&1 | Out-File -Append modules-build.log
            "=== $target exit $LASTEXITCODE ===" | Out-File -Append modules-build.log
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            ottod-build.log
            engine-build.log
            modules-build.log
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: Apps/OttoDesktop
        run: npm ci

      - name: Bridge tests against ottod.exe (ConPTY)
        working-directory: Apps/OttoDesktop
        shell: pwsh
        run: |
          $env:OTTOD_PATH = (Resolve-Path bin/win32-x64/ottod.exe).Path
          node --test --test-timeout=60000 test/ottod.test.js

      - name: Engine tests against otto-engine.exe
        if: steps.engine.outcome == 'success'
        working-directory: Apps/OttoDesktop
        shell: pwsh
        run: |
          $env:OTTO_ENGINE_PATH = (Resolve-Path bin/win32-x64/otto-engine.exe).Path
          node --test --test-timeout=90000 test/engine.test.js

      - name: Smoke test the desktop app
        working-directory: Apps/OttoDesktop
        shell: pwsh
        run: |
          $env:OTTOD_PATH = (Resolve-Path bin/win32-x64/ottod.exe).Path
          if (Test-Path bin/win32-x64/otto-engine.exe) {
            $env:OTTO_ENGINE_PATH = (Resolve-Path bin/win32-x64/otto-engine.exe).Path
          }
          $workspace = Join-Path $env:RUNNER_TEMP "Demo Project"
          New-Item -ItemType Directory -Force $workspace | Out-Null
          Set-Content (Join-Path $workspace README.md) "# Demo"
          node scripts/smoke.mjs $workspace (Join-Path $env:RUNNER_TEMP smoke)

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/smoke/*.png
          if-no-files-found: ignore

      - name: Unit tests (update signature gate)
        working-directory: Apps/OttoDesktop
        run: node --test test/update-manifest.test.js

      - name: Package installer
        working-directory: Apps/OttoDesktop
        env:
          # Authenticode signing turns on once a certificate is added as repository secrets
          # (WIN_CSC_LINK: base64 .pfx, WIN_CSC_KEY_PASSWORD). Without it the installer is
          # unsigned and Windows SmartScreen warns on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check the packaged app contents
        working-directory: Apps/OttoDesktop
        shell: bash
        run: |
          # Runtime modules must ship inside app.asar, or voice, terminals and updates break.
          asar=$(find dist -name app.asar | head -1)
          npx --yes @electron/asar list "$asar" > asar.txt
          for module in ws electron-updater @xterm/xterm @xterm/addon-fit; do
            grep -q "^/node_modules/$module/package.json$" asar.txt || { echo "missing $module in $asar"; exit 1; }
          done
          grep -q "^/src/updater.js$" asar.txt && grep -q "^/renderer/audio-capture.js$" asar.txt
          grep -q "maxtrigify.github.io/muse-releases/desktop" "$(dirname "$asar")/app-update.yml"
          echo "packaged app contents ok"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: otto-windows-installer
          # latest.yml and the blockmap are the update feed publish-desktop-release.sh signs.
          path: |
            Apps/OttoDesktop/dist/*.exe
            Apps/OttoDesktop/dist/*.exe.blockmap
            Apps/OttoDesktop/dist/latest.yml

  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build ottod
        run: |
          docker run --rm -v "$PWD":/src -w /src swift:6.2-noble bash -c '
            swift build -c release --product ottod --static-swift-stdlib -Xswiftc -warnings-as-errors &&
            swift build -c release --product otto-engine --static-swift-stdlib -Xswiftc -warnings-as-errors &&
            swift build -c release --product otto-mcp --static-swift-stdlib -Xswiftc -warnings-as-errors'
          mkdir -p Apps/OttoDesktop/bin/linux-x64
          # otto-mcp sits beside otto-engine: it is how agents reach Otto's tools.
          cp .build/release/ottod .build/release/otto-engine .build/release/otto-mcp Apps/OttoDesktop/bin/linux-x64/
          sudo chown -R "$USER" .build Apps/OttoDesktop/bin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: Apps/OttoDesktop
        run: npm ci

      - name: Bridge tests against ottod (Unix PTY)
        working-directory: Apps/OttoDesktop
        run: OTTOD_PATH="$PWD/bin/linux-x64/ottod" node --test --test-timeout=60000 test/ottod.test.js

      - name: Engine tests against otto-engine
        working-directory: Apps/OttoDesktop
        run: OTTO_ENGINE_PATH="$PWD/bin/linux-x64/otto-engine" node --test --test-timeout=90000 test/engine.test.js

      - name: Smoke test the desktop app
        working-directory: Apps/OttoDesktop
        run: |
          workspace="$RUNNER_TEMP/Demo Project"
          mkdir -p "$workspace" && echo "# Demo" > "$workspace/README.md"
          OTTOD_PATH="$PWD/bin/linux-x64/ottod" OTTO_ENGINE_PATH="$PWD/bin/linux-x64/otto-engine" \
            xvfb-run -a -s "-screen 0 1280x820x24" \
            node scripts/smoke.mjs "$workspace" "$RUNNER_TEMP/smoke"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: ${{ runner.temp }}/smoke/*.png
          if-no-files-found: ignore

      - name: Unit tests (update signature gate)
        working-directory: Apps/OttoDesktop
        run: node --test test/update-manifest.test.js

      - name: Package AppImage and deb
        working-directory: Apps/OttoDesktop
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Check the packaged app contents
        working-directory: Apps/OttoDesktop
        shell: bash
        run: |
          # Runtime modules must ship inside app.asar, or voice, terminals and updates break.
          asar=$(find dist -name app.asar | head -1)
          npx --yes @electron/asar list "$asar" > asar.txt
          for module in ws electron-updater @xterm/xterm @xterm/addon-fit; do
            grep -q "^/node_modules/$module/package.json$" asar.txt || { echo "missing $module in $asar"; exit 1; }
          done
          grep -q "^/src/updater.js$" asar.txt && grep -q "^/renderer/audio-capture.js$" asar.txt
          grep -q "maxtrigify.github.io/muse-releases/desktop" "$(dirname "$asar")/app-update.yml"
          echo "packaged app contents ok"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: otto-linux-packages
          path: |
            Apps/OttoDesktop/dist/*.AppImage
            Apps/OttoDesktop/dist/*.deb
            Apps/OttoDesktop/dist/latest-linux.yml
