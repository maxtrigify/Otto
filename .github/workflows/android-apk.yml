name: Android companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Apps/OttoAndroidApp/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'Apps/OttoAndroidApp/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build signed debug APK (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Apps/OttoAndroidApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub Ubuntu runners already provide Android command-line tools.
      # Avoid setup-android@v3: its legacy `sdkmanager tools` step fails on
      # current SDK repositories where the retired `tools` package is absent.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          test -f "$sdk_root/platforms/android-35/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Check APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Record APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: otto-android-debug-apk
          path: |
            Apps/OttoAndroidApp/app/build/outputs/apk/debug/app-debug.apk
            Apps/OttoAndroidApp/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
