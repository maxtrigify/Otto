# Production-scale acoustic keyword model for Otto. This is intentionally trained on raw audio;
# Otto must never implement wake-up by matching partial speech transcripts.
model_name: hey_otto
target_phrases: ["hey otto"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

# Adversarial negatives include the product name alone so ordinary conversation about Otto does
# not turn on the microphone session.
custom_negative_phrases:
  - "otto"
  - "auto"
  - "hey auto"
  - "lotto"
  - "motto"
  - "photo"
  - "hey photo"
  - "hey Oscar"
  - "a lot of"
  - "hot dog"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: small

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
